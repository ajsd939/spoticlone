name: spoticlone
description: Spotify-style dark music player. yt-dlp via Chaquopy + just_audio + audio_service.
publish_to: none
version: 1.1.0+6
environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  http: ^1.2.2
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+2
  sliding_up_panel: ^2.0.0+1
  rxdart: ^0.28.0
  package_info_plus: ^8.0.3
  url_launcher: ^6.3.1
  get_it: ^8.0.3
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.1
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  window_manager: ^0.5.2
  shared_preferences: ^2.5.6
  open_filex: ^4.7.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true






